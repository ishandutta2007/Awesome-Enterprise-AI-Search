<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }
    @keyframes scan {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(14px) translateX(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    .node { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .scan-beam { animation: scan 6s linear infinite; }
    .float-item1 { animation: float1 7s ease-in-out infinite; }
    .float-item2 { animation: float2 9s ease-in-out infinite; }
    .conn-line { stroke-dasharray: 6, 6; animation: dash 12s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Glowing background ambient orbs -->
  <circle cx="200" cy="120" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="280" r="160" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="210" r="180" fill="#0ea5e9" opacity="0.08" filter="url(#glow)"/>

  <!-- Scanning laser beam effect -->
  <rect class="scan-beam" x="0" y="0" width="1200" height="3" fill="url(#beamGrad)" opacity="0.7"/>

  <!-- Knowledge Graph Nodes & Connectors (Left and Right Flanks) -->
  <g opacity="0.6">
    <!-- Left Graph -->
    <line x1="80" y1="90" x2="160" y2="150" stroke="#38bdf8" stroke-width="1.5" class="conn-line"/>
    <line x1="160" y1="150" x2="110" y2="250" stroke="#818cf8" stroke-width="1.5" class="conn-line"/>
    <line x1="160" y1="150" x2="220" y2="200" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="110" y1="250" x2="190" y2="310" stroke="#818cf8" stroke-width="1.5" class="conn-line"/>

    <circle cx="80" cy="90" r="5" fill="#38bdf8" class="node"/>
    <circle cx="160" cy="150" r="7" fill="#818cf8" class="node"/>
    <circle cx="110" cy="250" r="6" fill="#34d399" class="node"/>
    <circle cx="220" cy="200" r="4" fill="#38bdf8" class="node"/>
    <circle cx="190" cy="310" r="6" fill="#818cf8" class="node"/>

    <!-- Right Graph -->
    <line x1="1020" y1="110" x2="1110" y2="170" stroke="#818cf8" stroke-width="1.5" class="conn-line"/>
    <line x1="1020" y1="110" x2="960" y2="210" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="960" y1="210" x2="1050" y2="290" stroke="#818cf8" stroke-width="1.5" class="conn-line"/>
    <line x1="1110" y1="170" x2="1050" y2="290" stroke="#34d399" stroke-width="1.5"/>

    <circle cx="1020" cy="110" r="6" fill="#818cf8" class="node"/>
    <circle cx="1110" cy="170" r="7" fill="#34d399" class="node"/>
    <circle cx="960" cy="210" r="5" fill="#38bdf8" class="node"/>
    <circle cx="1050" cy="290" r="6" fill="#818cf8" class="node"/>
  </g>

  <!-- Central Search Icon Graphic -->
  <g transform="translate(600, 110)" class="float-item1">
    <circle cx="0" cy="0" r="46" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Magnifying glass with neural core -->
    <circle cx="-6" cy="-6" r="18" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="8" y1="8" x2="24" y2="24" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-6" cy="-6" r="6" fill="#818cf8">
      <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Banner Main Titles -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 195)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">⚡ CURATED KNOWLEDGE &amp; CODE ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="255" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="0.5">
      Awesome Enterprise AI Search
    </text>

    <!-- Subtitle Line -->
    <text x="600" y="298" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.5">
      Intelligent Workplace Search • Semantic &amp; Hybrid Retrieval • Enterprise RAG • Knowledge Graphs
    </text>

    <!-- Feature Tags -->
    <g transform="translate(600, 345)">
      <rect x="-310" y="-12" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="-245" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">🏢 SaaS Platforms</text>

      <rect x="-165" y="-12" width="150" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="-90" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">🌍 Open-Source Stacks</text>

      <rect x="0" y="-12" width="140" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">🧠 Neural Retrieval</text>

      <rect x="155" y="-12" width="155" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="232" y="4" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">🔐 Security Trimming</text>
    </g>
  </g>

  <!-- Bottom Glowing Accent Line -->
  <line x1="250" y1="395" x2="950" y2="395" stroke="url(#accentLine)" stroke-width="2"/>
</svg>